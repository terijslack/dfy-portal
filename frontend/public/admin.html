<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Meta Pixel Code -->

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Accounts — DFY Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="stylesheet" href="/admin.css" />
</head>
<body class="admin-page">

  <header class="header">
    <div class="header-inner">
      <div class="header-left">
        <a href="/" class="brand-wordmark"><span class="brand-wordmark-serif">Done For You</span><span class="brand-wordmark-sans">Marketing</span></a>
        <nav class="admin-nav" aria-label="Admin">
          <a href="/admin" aria-current="page">Accounts</a>
          <a href="/admin/contacts">Contacts</a>
          <a href="/admin/pipeline">Pipeline</a>
        </nav>
      </div>
      <div class="header-right">
        <span class="admin-badge">Admin</span>
        <button class="btn-secondary" id="stripeTestBtn">Run $1 Stripe test</button>
        <button class="btn-logout" id="logoutBtn">Sign out</button>
      </div>
    </div>
  </header>

  <main class="crm-main">

    <!-- ACCOUNTS LIST -->
    <section id="listView">
      <div class="crm-top">
        <div>
          <h1>Accounts</h1>
          <div class="crm-sub">Every client business. Status follows billing; click one to open everything about them.</div>
        </div>
        <div class="crm-tools">
          <input id="acctSearch" class="crm-search" type="search" placeholder="Search business, contact, city" />
          <div class="seg" id="statusSeg">
            <button data-status="" class="on">All</button>
            <button data-status="Active">Active</button>
            <button data-status="Inactive">Inactive</button>
          </div>
        </div>
      </div>
      <div class="crm-table-wrap">
        <table class="crm-table">
          <thead>
            <tr>
              <th>Account</th>
              <th>Status</th>
              <th>Priority</th>
              <th class="hide-sm">City</th>
              <th>Plan</th>
              <th class="hide-sm">Posts to review</th>
              <th class="hide-sm">Last activity</th>
            </tr>
          </thead>
          <tbody id="acctRows"><tr><td colspan="7" class="crm-empty">Loading…</td></tr></tbody>
        </table>
      </div>
    </section>

    <!-- ONE ACCOUNT -->
    <section id="acctView" class="hidden">
      <a href="/admin" class="back-link" onclick="event.preventDefault(); showList()">← All accounts</a>
      <div id="clientPostsHeader" class="acct-head"></div>

      <div id="clientTabs" class="cd-tabs">
        <button class="cd-tab active" data-tab="overview" onclick="showTab('overview')">Overview</button>
        <button class="cd-tab" data-tab="people" onclick="showTab('people')">People</button>
        <button class="cd-tab" data-tab="brand" onclick="showTab('brand')">Brand &amp; socials</button>
        <button class="cd-tab" data-tab="activity" onclick="showTab('activity')">Activity</button>
        <button class="cd-tab" data-tab="posts" onclick="showTab('posts')">Posts</button>
      </div>

      <div id="pane-overview" class="acct-pane"></div>
      <div id="pane-people" class="acct-pane hidden"></div>
      <div id="pane-brand" class="acct-pane hidden"></div>
      <div id="pane-activity" class="acct-pane hidden"></div>

      <!-- POSTS TAB -->
      <div id="pane-posts" class="acct-pane hidden">
      <div id="addPostForm" class="add-post-form">
        <h3>Add New Post</h3>
        <div class="form-row">
          <div class="field">
            <label>Platform</label>
            <select id="newPlatform">
              <option value="instagram">Instagram</option>
              <option value="facebook">Facebook</option>
              <option value="twitter">Twitter / X</option>
              <option value="linkedin">LinkedIn</option>
              <option value="tiktok">TikTok</option>
            </select>
          </div>
          <div class="field">
            <label>Scheduled Date</label>
            <input type="date" id="newDate" />
          </div>
        </div>
        <div class="field">
          <label>Caption</label>
          <textarea id="newCaption" rows="4" placeholder="Write the post caption here…"></textarea>
        </div>
        <button class="btn-primary" id="addPostBtn">Add Post</button>
      </div>

      <div id="adminPostsGrid" class="posts-grid"></div>
      </div>

      <div class="cd-savebar hidden" id="profileSaveBar">
        <span id="profileSaveMsg" class="cd-save-msg"></span>
        <button class="btn-secondary" id="profileResetBtn" onclick="renderAccount(currentDetail)">Discard changes</button>
        <button class="btn-primary" id="profileSaveBtn" onclick="saveProfile()">Save changes</button>
      </div>
    </section>

  </main>

  <!-- Edit post modal -->
  <div class="modal-overlay" id="editModal">
    <div class="modal">
      <h2>Edit Post</h2>
      <input type="hidden" id="editPostId" />
      <div class="field">
        <label>Platform</label>
        <select id="editPlatform">
          <option value="instagram">Instagram</option>
          <option value="facebook">Facebook</option>
          <option value="twitter">Twitter / X</option>
          <option value="linkedin">LinkedIn</option>
          <option value="tiktok">TikTok</option>
        </select>
      </div>
      <div class="field">
        <label>Scheduled Date</label>
        <input type="date" id="editDate" />
      </div>
      <div class="field">
        <label>Caption</label>
        <textarea id="editCaption" rows="5"></textarea>
      </div>
      <div class="field">
        <label>Status</label>
        <select id="editStatus">
          <option value="pending">Pending</option>
          <option value="approved">Approved</option>
          <option value="changes_requested">Changes Requested</option>
        </select>
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" id="cancelEdit">Cancel</button>
        <button class="btn-primary" id="saveEdit">Save Changes</button>
      </div>
    </div>
  </div>

  <script>
    let selectedClientId = null;
    let selectedClientName = '';
    let accounts = [];
    let currentDetail = null;
    let currentTab = 'overview';
    let statusFilter = '';
    let activityFilter = '';

    const fmt = d => d ? new Date(d).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '';
    const when = d => d ? new Date(d).toLocaleString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' }) : '';
    function ago(d) {
      if (!d) return '';
      const days = Math.floor((Date.now() - new Date(d).getTime()) / 86400000);
      return days <= 0 ? 'today' : days === 1 ? 'yesterday' : days < 30 ? `${days} days ago` : fmt(d);
    }
    const cap = s => s ? s[0].toUpperCase() + s.slice(1) : '';

    async function init() {
      const meRes = await fetch('/api/auth/me');
      const meData = await meRes.json();

      if (!meData.user || !meData.user.is_admin) {
        window.location.href = meData.user ? '/dashboard' : '/';
        return;
      }

      await loadClients();
      const cid = parseInt(new URLSearchParams(location.search).get('client'), 10);
      if (cid) selectClient(cid, { replace: true });
    }

    window.addEventListener('popstate', () => {
      const cid = parseInt(new URLSearchParams(location.search).get('client'), 10);
      cid ? selectClient(cid, { noHistory: true }) : showList(true);
    });

    // ─── ACCOUNTS LIST ───────────────────────────────────────────
    async function loadClients() {
      try {
        const res = await fetch('/api/admin/clients');
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        accounts = data.clients || [];
        renderClients();
      } catch (err) {
        document.getElementById('acctRows').innerHTML = '<tr><td colspan="7" class="crm-empty">Could not load accounts.</td></tr>';
      }
    }

    const statusPill = c => `<span class="pill ${c.status === 'Active' ? 'ok' : ''}">${c.status}</span>` +
      (c.status_note ? `<div class="muted">${escapeHtml(c.status_note)}</div>` : '');
    const priorityPill = p => p ? `<span class="pill prio-${p}">${cap(p)}</span>` : '<span class="muted">—</span>';
    const tierPill = c => c.plan_tier ? `<span class="pill tier">${escapeHtml(c.plan_tier)}</span>` : '<span class="muted">—</span>';

    function renderClients() {
      const q = document.getElementById('acctSearch').value.trim().toLowerCase();
      const PRI = { high: 0, medium: 1, low: 2 };
      const list = accounts
        .filter(c => !statusFilter || c.status === statusFilter)
        .filter(c => !q || [c.business_name, c.name, c.email, c.city].some(v => (v || '').toLowerCase().includes(q)))
        .sort((a, b) => (a.status === b.status ? 0 : a.status === 'Active' ? -1 : 1) ||
          ((PRI[a.priority] ?? 3) - (PRI[b.priority] ?? 3)) ||
          (a.business_name || a.name).localeCompare(b.business_name || b.name));
      const tb = document.getElementById('acctRows');
      if (!list.length) {
        tb.innerHTML = `<tr><td colspan="7" class="crm-empty">${accounts.length ? 'No accounts match.' : 'No client accounts yet.'}</td></tr>`;
        return;
      }
      tb.innerHTML = list.map(c => `
        <tr onclick="selectClient(${c.id})">
          <td class="who"><b>${escapeHtml(c.business_name || c.name)}</b>${c.business_name ? `<span class="muted">${escapeHtml(c.name)}</span>` : ''}</td>
          <td>${statusPill(c)}</td>
          <td>${priorityPill(c.priority)}</td>
          <td class="hide-sm">${escapeHtml([c.city, c.state].filter(Boolean).join(', ')) || '<span class="muted">—</span>'}</td>
          <td>${tierPill(c)}</td>
          <td class="hide-sm">${Number(c.pending) || Number(c.changes_requested)
            ? `${Number(c.pending) ? `<span class="stat pending">${c.pending} pending</span>` : ''} ${Number(c.changes_requested) ? `<span class="stat changes">${c.changes_requested} changes</span>` : ''}`
            : '<span class="muted">—</span>'}</td>
          <td class="hide-sm muted">${escapeHtml(ago(c.last_activity))}</td>
        </tr>`).join('');
    }

    document.getElementById('acctSearch').addEventListener('input', renderClients);
    document.querySelectorAll('#statusSeg button').forEach(b => b.addEventListener('click', () => {
      document.querySelectorAll('#statusSeg button').forEach(x => x.classList.toggle('on', x === b));
      statusFilter = b.dataset.status;
      renderClients();
    }));

    function showList(noHistory) {
      if (profileDirty() && !confirm('You have unsaved changes. Leave without saving?')) return;
      selectedClientId = null;
      currentDetail = null;
      document.getElementById('acctView').classList.add('hidden');
      document.getElementById('listView').classList.remove('hidden');
      document.getElementById('profileSaveBar').classList.add('hidden');
      if (!noHistory) history.pushState(null, '', '/admin');
      document.title = 'Accounts — DFY Admin';
      loadClients();
    }

    // ─── ONE ACCOUNT ─────────────────────────────────────────────
    async function selectClient(clientId, opts = {}) {
      if (profileDirty() && !confirm('You have unsaved changes. Leave without saving?')) return;
      selectedClientId = clientId;
      document.getElementById('listView').classList.add('hidden');
      document.getElementById('acctView').classList.remove('hidden');
      document.getElementById('clientPostsHeader').innerHTML = '<div class="loading">Loading…</div>';
      ['overview', 'people', 'brand', 'activity'].forEach(t => document.getElementById('pane-' + t).innerHTML = '');
      if (!opts.noHistory) history[opts.replace ? 'replaceState' : 'pushState'](null, '', `/admin?client=${clientId}`);
      window.scrollTo(0, 0);
      await loadClientDetail(clientId);
      showTab(currentTab);
      loadClientPosts(clientId);
    }

    function showTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.cd-tab').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
      document.querySelectorAll('.acct-pane').forEach(p => p.classList.toggle('hidden', p.id !== 'pane-' + tab));
    }

    async function loadClientDetail(clientId) {
      try {
        const res = await fetch(`/api/admin/clients/${clientId}`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Could not load account.');
        currentDetail = data;
        renderAccount(data);
      } catch (err) {
        document.getElementById('clientPostsHeader').innerHTML = `<div class="error">${escapeHtml(err.message)}</div>`;
      }
    }

    // Every editable field maps to one column. "src" says which part of the API
    // response it comes from. Edits save to the same records the client's own
    // portal uses, so there is one copy of each client's data.
    const VOICES = ['Professional', 'Friendly', 'Trustworthy', 'Confident', 'Engaging', 'Empathetic', 'Innovative'];
    const GOALS = ['Build brand awareness', 'Grow followers & engagement', 'Generate leads & sales', 'Build community & loyalty', 'Establish thought leadership'];
    const TIMEZONES = [
      ['America/Los_Angeles', 'Pacific (Los Angeles)'], ['America/Denver', 'Mountain (Denver)'],
      ['America/Phoenix', 'Mountain, no DST (Phoenix)'], ['America/Chicago', 'Central (Chicago)'],
      ['America/New_York', 'Eastern (New York)'], ['America/Anchorage', 'Alaska'], ['Pacific/Honolulu', 'Hawaii'],
    ];
    const SECTIONS = [
      { title: 'Account', desc: 'Their business name and portal login.', fields: [
        { key: 'business_name', label: 'Business name', src: 'client' },
        { key: 'name', label: 'Main contact', src: 'client' },
        { key: 'email', label: 'Login email', src: 'client', type: 'email', hint: 'Changing this changes the email they log in with.' },
        { key: 'metricool_blog_id', label: 'Metricool brand ID', src: 'client', hint: 'From Metricool — which brand their posts schedule under. Leave blank until you have it; approving a post still works either way.' },
      ]},
      { title: 'Business profile', desc: 'From their Business Profile in the client portal. Edits here show up there too.', fields: [
        { key: 'industry', label: 'Industry', list: ['Home Services', 'Auto Dealer', 'Beauty Services'] },
        { key: 'website', label: 'Website', type: 'url' },
        { key: 'phone', label: 'Business phone', type: 'tel' },
        { key: 'business_email', label: 'Business email', type: 'email' },
        { key: 'address', label: 'Street address', full: true },
        { key: 'city', label: 'City' },
        { key: 'state', label: 'State' },
        { key: 'zip', label: 'ZIP' },
        { key: 'timezone', label: 'Time zone', options: TIMEZONES },
        { key: 'referral_source', label: 'How they heard about us' },
      ]},
      { title: 'Brand voice & goals', desc: 'What we use to write their posts.', fields: [
        { key: 'brand_voice', label: 'Brand voice', options: VOICES.map(v => [v, v]) },
        { key: 'primary_goal', label: 'Main goal', options: GOALS.map(g => [g, g]) },
        { key: 'target_audience', label: 'Target audience', textarea: true, full: true },
        { key: 'content_themes', label: 'Customer pain points / content themes', textarea: true, full: true },
        { key: 'unique_selling_point', label: 'What makes them different', textarea: true, full: true },
        { key: 'avoid_content', label: 'Topics to avoid', textarea: true, full: true },
        { key: 'additional_notes', label: 'Anything else they told us', textarea: true, full: true },
      ]},
    ];

    function fieldValue(data, f) {
      const src = f.src === 'client' ? data.client : data.profile;
      return src[f.key] ?? '';
    }

    function renderField(data, f) {
      const v = fieldValue(data, f);
      const attrs = `data-key="${f.key}" data-original="${escapeHtml(v)}" oninput="markChanged(this)" onchange="markChanged(this)"`;
      let input;
      if (f.textarea) {
        input = `<textarea rows="3" ${attrs}>${escapeHtml(v)}</textarea>`;
      } else if (f.options) {
        const known = f.options.some(([val]) => val === v);
        input = `<select ${attrs}>
          <option value="">Not set</option>
          ${f.options.map(([val, label]) => `<option value="${escapeHtml(val)}" ${val === v ? 'selected' : ''}>${escapeHtml(label)}</option>`).join('')}
          ${v && !known ? `<option value="${escapeHtml(v)}" selected>${escapeHtml(v)}</option>` : ''}
        </select>`;
      } else {
        const listId = f.list ? `dl-${f.key}` : '';
        input = `<input type="${f.type || 'text'}" value="${escapeHtml(v)}" ${listId ? `list="${listId}"` : ''} ${attrs} />
          ${f.list ? `<datalist id="${listId}">${f.list.map(o => `<option value="${escapeHtml(o)}">`).join('')}</datalist>` : ''}`;
      }
      return `<div class="cd-field ${f.full ? 'full' : ''}">
        <label>${escapeHtml(f.label)}</label>${input}
        ${f.hint ? `<span class="cd-hint">${escapeHtml(f.hint)}</span>` : ''}
      </div>`;
    }

    function readonly(label, value, full) {
      const empty = value === null || value === undefined || value === '';
      return `<div class="cd-field ${full ? 'full' : ''}"><label>${escapeHtml(label)}</label>
        <div class="cd-readonly ${empty ? 'empty' : ''}">${empty ? 'Not set' : value}</div></div>`;
    }

    const STAGE_NAMES = { new: 'New Lead', contacted: 'Contacted', qualified: 'Qualified', proposal: 'Proposal Sent',
      negotiation: 'Negotiation', checkout: 'Checkout Started', won: 'Won', lost: 'Lost' };
    const money = v => v == null || v === '' ? '' : Number(v).toLocaleString('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 });

    function renderAccount(data) {
      if (!data) return;
      const c = data.client, p = data.profile;
      selectedClientName = c.business_name || c.name;
      document.title = `${selectedClientName} — DFY Admin`;

      // Header
      document.getElementById('clientPostsHeader').innerHTML = `
        <div class="acct-title">
          <h1>${escapeHtml(selectedClientName)}</h1>
          <div class="crm-sub">${escapeHtml([c.name, c.email, [p.city, p.state].filter(Boolean).join(', ')].filter(Boolean).join(' · '))}</div>
        </div>
        <div class="acct-chips">
          <div class="acct-chip"><label>Status</label>${statusPill(c)}</div>
          <div class="acct-chip"><label>Plan</label>${tierPill(c)}${c.plan && c.plan_tier === 'Custom' ? `<div class="muted">${escapeHtml(c.plan)}</div>` : ''}</div>
          <div class="acct-chip"><label for="prioritySel">Priority</label>
            <select id="prioritySel" class="prio-select prio-${c.priority || 'none'}" onchange="savePriority(this.value)">
              <option value="">Not set</option>
              ${['high', 'medium', 'low'].map(x => `<option value="${x}" ${c.priority === x ? 'selected' : ''}>${cap(x)}</option>`).join('')}
            </select>
          </div>
        </div>`;

      // Overview
      const sections = SECTIONS.map(s => `
        <div class="cd-section">
          <h3>${escapeHtml(s.title)}</h3><p class="cd-desc">${escapeHtml(s.desc)}</p>
          <div class="cd-grid">${s.fields.map(f => renderField(data, f)).join('')}</div>
        </div>`).join('');
      const plan = `
        <div class="cd-section">
          <h3>Plan & billing</h3><p class="cd-desc">Read-only here. Status follows billing, and billing changes happen in Stripe so the two never disagree.</p>
          <div class="cd-grid">
            ${readonly('Plan', escapeHtml(c.plan || ''))}
            ${readonly('Billing', escapeHtml(cap((c.subscription_status || '').replace('_', ' '))))}
            ${readonly('Client since', fmt(c.subscription_start_date || c.created_at))}
            ${readonly('Next billing date', fmt(c.billing_date))}
            ${c.stripe_customer_id ? readonly('Stripe', `<a href="https://dashboard.stripe.com/customers/${encodeURIComponent(c.stripe_customer_id)}" target="_blank" rel="noopener">Open customer in Stripe ↗</a>`, true) : ''}
          </div>
        </div>`;
      const deals = `
        <div class="cd-section">
          <h3>Deals</h3><p class="cd-desc">From the Pipeline.</p>
          ${data.deals.length ? data.deals.map(d => `
            <div class="deal"><div class="deal-top"><b>${escapeHtml(d.title)}</b><span class="val">${money(d.value)}</span></div>
            <div class="deal-meta">${escapeHtml(STAGE_NAMES[d.stage] || d.stage)}${d.source ? ' · source: ' + escapeHtml(d.source) : ''} · ${escapeHtml(d.person)}</div></div>`).join('')
            : '<div class="cd-readonly empty">No deals.</div>'}
          <div class="row-actions"><a class="btn-secondary btn-sm" style="text-decoration:none" href="/admin/pipeline">Open Pipeline →</a></div>
        </div>`;
      const notes = `
        <div class="cd-section private">
          <h3>Internal notes</h3><p class="cd-desc">Standing notes about this account. Only you and your team see this — never the client. For calls and updates, add a note on the Activity tab.</p>
          <div class="cd-grid">${renderField(data, { key: 'admin_notes', label: 'Notes', src: 'client', textarea: true, full: true })}</div>
        </div>`;
      document.getElementById('pane-overview').innerHTML = sections + plan + deals + notes;

      renderPeople(data);
      renderBrand(data);
      renderActivity(data);
      document.getElementById('profileSaveBar').classList.add('hidden');
      document.getElementById('profileSaveMsg').textContent = '';
    }

    // People
    function renderPeople(data) {
      document.getElementById('pane-people').innerHTML = `
        <div class="cd-section">
          <h3>People at ${escapeHtml(selectedClientName)}</h3>
          <p class="cd-desc">Everyone connected to this account. The portal login is the person who signed up.</p>
          ${data.people.map(x => `
            <div class="person">
              <div class="person-main">
                <b>${escapeHtml(x.name)}</b>${x.job_title ? ` <span class="muted">· ${escapeHtml(x.job_title)}</span>` : ''}
                ${x.client_id ? ' <span class="pill client">Portal login</span>' : ''}
                <div class="muted">${escapeHtml([x.email, x.phone].filter(Boolean).join(' · ')) || 'No email or phone yet'}</div>
              </div>
              <div class="person-actions">
                ${x.email ? `<a href="mailto:${escapeHtml(x.email)}">Email</a>` : ''}
                ${x.phone ? `<a href="tel:${escapeHtml(x.phone.replace(/[^\d+]/g, ''))}">Call</a>` : ''}
                <a href="/admin/contacts?contact=${x.id}">Open</a>
                ${x.client_id ? '' : `<button class="btn-danger-link" onclick="unlinkPerson(${x.id}, ${JSON.stringify(escapeHtml(x.name))})">Remove</button>`}
              </div>
            </div>`).join('')}
        </div>
        <div class="cd-section">
          <h3>Add a person</h3>
          <div class="cd-grid">
            <div class="cd-field"><label>Name *</label><input id="pName" /></div>
            <div class="cd-field"><label>Job title</label><input id="pTitle" placeholder="Owner, manager…" /></div>
            <div class="cd-field"><label>Email</label><input id="pEmail" type="email" /></div>
            <div class="cd-field"><label>Phone</label><input id="pPhone" type="tel" /></div>
          </div>
          <div class="row-actions"><span class="msg" id="pMsg"></span><button class="btn-primary btn-sm" onclick="addPerson()">Add person</button></div>
          <div class="cd-field full" style="margin-top:14px">
            <label>…or link someone already in Contacts</label>
            <div style="display:flex;gap:8px"><select id="pLink" style="flex:1"><option value="">Loading…</option></select>
            <button class="btn-secondary btn-sm" onclick="linkPerson()">Link</button></div>
          </div>
        </div>`;
      fetch('/api/admin/contacts?type=lead').then(r => r.json()).then(d => {
        const sel = document.getElementById('pLink');
        if (!sel) return;
        sel.innerHTML = '<option value="">Choose a contact…</option>' + (d.contacts || [])
          .sort((a, b) => a.name.localeCompare(b.name))
          .map(x => `<option value="${x.id}">${escapeHtml(x.name)}${x.company ? ' — ' + escapeHtml(x.company) : ''}</option>`).join('');
      }).catch(() => {});
    }

    async function postJSON(url, method, body) {
      const res = await fetch(url, { method, headers: body ? { 'Content-Type': 'application/json' } : undefined, body: body ? JSON.stringify(body) : undefined });
      let data = {}; try { data = await res.json(); } catch (_) {}
      if (!res.ok) throw new Error(data.error || 'Something went wrong. Try again.');
      return data;
    }
    const setPMsg = (t, k) => { const m = document.getElementById('pMsg'); if (m) { m.textContent = t; m.className = 'msg' + (k ? ' ' + k : ''); } };

    async function addPerson() {
      const v = id => document.getElementById(id).value;
      try {
        await postJSON(`/api/admin/clients/${selectedClientId}/people`, 'POST', { name: v('pName'), job_title: v('pTitle'), email: v('pEmail'), phone: v('pPhone') });
        await loadClientDetail(selectedClientId);
        showTab('people');
      } catch (err) { setPMsg(err.message, 'error'); }
    }
    async function linkPerson() {
      const id = document.getElementById('pLink').value;
      if (!id) return setPMsg('Choose a contact first.', 'error');
      try {
        await postJSON(`/api/admin/clients/${selectedClientId}/people`, 'POST', { contact_id: id });
        await loadClientDetail(selectedClientId);
        showTab('people');
      } catch (err) { setPMsg(err.message, 'error'); }
    }
    async function unlinkPerson(pid, name) {
      if (!confirm(`Remove ${name} from this account? They'll stay in Contacts.`)) return;
      try {
        await postJSON(`/api/admin/clients/${selectedClientId}/people/${pid}`, 'DELETE');
        await loadClientDetail(selectedClientId);
        showTab('people');
      } catch (err) { alert(err.message); }
    }

    // Brand & socials
    function renderBrand(data) {
      const b = data.brand_assets;
      const colors = (b.brand_colors || []).map(col => typeof col === 'string' ? col : (col.hex || col.value || '')).filter(Boolean);
      const t = b.brand_typography || {};
      document.getElementById('pane-brand').innerHTML = `
        <div class="cd-section">
          <h3>Brand identity</h3><p class="cd-desc">Logo, colors, fonts and photos they gave us in their portal.</p>
          <div class="cd-grid">
            ${readonly('Logo', b.logo_url ? `<a href="${escapeHtml(safeUrl(b.logo_url))}" target="_blank" rel="noopener"><img class="cd-logo" src="${escapeHtml(safeUrl(b.logo_url))}" alt="Logo"></a>` : '')}
            ${readonly('Brand colors', colors.length ? `<div class="cd-swatches">${colors.map(h => `<span class="cd-swatch"><i style="background:${escapeHtml(h)}"></i>${escapeHtml(h)}</span>`).join('')}</div>` : '')}
            ${readonly('Heading font', escapeHtml(t.heading_font || ''))}
            ${readonly('Body font', escapeHtml(t.body_font || ''))}
            ${t.notes ? readonly('Font notes', escapeHtml(t.notes), true) : ''}
            ${b.brand_website_url ? readonly('Pull brand from', `<a href="${escapeHtml(safeUrl(b.brand_website_url))}" target="_blank" rel="noopener">${escapeHtml(b.brand_website_url)}</a>`, true) : ''}
            ${readonly('Photos & content', (b.content_urls || []).length ? `<div class="cd-thumbs">${b.content_urls.map(u => { const url = typeof u === 'string' ? u : (u.url || ''); return url ? `<a href="${escapeHtml(safeUrl(url))}" target="_blank" rel="noopener"><img src="${escapeHtml(safeUrl(url))}" alt=""></a>` : ''; }).join('')}</div>` : '', true)}
          </div>
        </div>
        <div class="cd-section">
          <h3>Accounts we manage</h3><p class="cd-desc">Social accounts they've connected in their portal.</p>
          <div class="cd-socials">
            ${data.socials.length ? data.socials.map(s => `
              <div class="cd-social">
                <strong>${escapeHtml(s.platform)}</strong>
                <span>${escapeHtml(s.username)}</span>
                ${s.profile_url ? `<a href="${escapeHtml(safeUrl(s.profile_url))}" target="_blank" rel="noopener">${escapeHtml(s.profile_url)}</a>` : ''}
                <span class="when">${fmt(s.connected_at)}</span>
              </div>`).join('') : '<div class="cd-readonly empty">None connected yet.</div>'}
          </div>
          <div class="cd-grid">${renderField(data, { key: 'social_notes', label: 'Their notes about these accounts', textarea: true, full: true })}</div>
        </div>`;
    }

    // Activity: everything in and out
    const KIND = {
      client: ['From client', 'k-client'], dfy: ['From DFY', 'k-dfy'], note: ['Internal note', 'k-note'],
      form: ['Website message', 'k-client'], signup: ['Signup', 'k-system'], stage: ['Pipeline', 'k-system'], system: ['Update', 'k-system'],
    };
    function renderActivity(data) {
      const loginName = (data.people.find(x => x.client_id) || {}).name;
      const list = data.activity.filter(a => !activityFilter ||
        (activityFilter === 'client' ? ['client', 'form'].includes(a.type) : activityFilter === 'other' ? ['signup', 'stage', 'system'].includes(a.type) : a.type === activityFilter));
      const ANSWER = { yes: ['Yes', 'ok'], no: ['Not this time', ''], ok: ['Got it', 'ok'] };
      const msgs = data.messages || [];
      document.getElementById('pane-activity').innerHTML = `
        <div class="cd-section">
          <h3>Send to their dashboard</h3>
          <p class="cd-desc">Shows on their dashboard under "From your marketing team". Their answer comes back here and on the timeline below.</p>
          <div class="cd-field full"><textarea id="msgText" rows="3" placeholder="e.g. Want us to put together a holiday promotion post?"></textarea></div>
          <div class="row-actions">
            <label style="display:flex;gap:6px;align-items:center;font-size:13px;margin-right:auto"><input type="checkbox" id="msgAsk" style="width:auto" checked /> Ask for a Yes / Not this time answer</label>
            <span class="msg" id="mMsg"></span>
            <button class="btn-primary btn-sm" onclick="sendMessage()">Send</button>
          </div>
          ${msgs.length ? `<ul class="timeline" style="margin-top:14px">${msgs.map(m => {
            const [word, cls] = ANSWER[m.response] || [];
            return `<li><div class="t-body">${escapeHtml(m.body)}
                ${m.responded_at
                  ? `<div style="margin-top:4px"><span class="pill ${cls}">${m.ask ? word : 'Read'}</span>${m.reply ? ` “${escapeHtml(m.reply)}”` : ''}</div>`
                  : `<div style="margin-top:4px"><span class="pill">Waiting on them</span> <button class="btn-danger-link" onclick="unsendMessage(${m.id})">Take back</button></div>`}
              </div>
              <div class="t-when">Sent ${escapeHtml(when(m.created_at))}${m.responded_at ? ' · answered ' + escapeHtml(when(m.responded_at)) : ''}</div></li>`;
          }).join('')}</ul>` : ''}
        </div>
        <div class="cd-section">
          <h3>Add an internal note</h3>
          <div class="cd-field full"><textarea id="noteText" rows="2" placeholder="A call, a meeting, what they asked for… (the client won't see this)"></textarea></div>
          <div class="row-actions"><span class="msg" id="nMsg"></span><button class="btn-primary btn-sm" onclick="addNote()">Add note</button></div>
        </div>
        <div class="cd-section">
          <div class="acct-act-head">
            <h3>Everything in and out</h3>
            <div class="seg" id="actSeg">
              ${[['', 'All'], ['client', 'From client'], ['dfy', 'From DFY'], ['note', 'Notes'], ['other', 'Other']]
                .map(([k, l]) => `<button class="${activityFilter === k ? 'on' : ''}" onclick="activityFilter='${k}'; renderActivity(currentDetail)">${l}</button>`).join('')}
            </div>
          </div>
          <p class="cd-desc">What they've done in their portal, what we've sent them, billing changes and your notes — newest first.</p>
          ${list.length ? `<ul class="timeline">${list.map(a => {
            const [label, cls] = KIND[a.type] || ['Update', 'k-system'];
            return `<li class="t-${escapeHtml(a.type)}"><div class="t-body"><span class="kind ${cls}">${label}</span>${escapeHtml(a.body)}</div>
              <div class="t-when">${escapeHtml(when(a.created_at))}${a.person !== loginName ? ' · ' + escapeHtml(a.person) : ''}</div></li>`;
          }).join('')}</ul>` : '<div class="cd-readonly empty">Nothing here yet.</div>'}
        </div>`;
    }

    async function addNote() {
      const text = document.getElementById('noteText').value.trim();
      const m = document.getElementById('nMsg');
      if (!text) { m.textContent = 'Write a note first.'; m.className = 'msg error'; return; }
      try {
        await postJSON(`/api/admin/clients/${selectedClientId}/notes`, 'POST', { body: text });
        await loadClientDetail(selectedClientId);
        showTab('activity');
      } catch (err) { m.textContent = err.message; m.className = 'msg error'; }
    }

    async function sendMessage() {
      const text = document.getElementById('msgText').value.trim();
      const m = document.getElementById('mMsg');
      if (!text) { m.textContent = 'Write a message first.'; m.className = 'msg error'; return; }
      try {
        await postJSON(`/api/admin/clients/${selectedClientId}/messages`, 'POST', { body: text, ask: document.getElementById('msgAsk').checked });
        await loadClientDetail(selectedClientId);
        showTab('activity');
      } catch (err) { m.textContent = err.message; m.className = 'msg error'; }
    }
    async function unsendMessage(mid) {
      if (!confirm('Take this message back? It will disappear from their dashboard.')) return;
      try {
        await postJSON(`/api/admin/clients/${selectedClientId}/messages/${mid}`, 'DELETE');
        await loadClientDetail(selectedClientId);
        showTab('activity');
      } catch (err) { alert(err.message); }
    }

    async function savePriority(value) {
      try {
        await postJSON(`/api/admin/clients/${selectedClientId}`, 'PUT', { priority: value });
        currentDetail.client.priority = value || null;
        document.getElementById('prioritySel').className = `prio-select prio-${value || 'none'}`;
        const acct = accounts.find(a => a.id === selectedClientId);
        if (acct) acct.priority = value || null;
        loadClientDetail(selectedClientId);
      } catch (err) { alert(err.message); }
    }

    // ─── Saving profile edits (any tab) ──────────────────────────
    function markChanged(el) {
      el.classList.toggle('changed', el.value !== el.dataset.original);
      const dirty = profileDirty();
      document.getElementById('profileSaveBar').classList.toggle('hidden', !dirty);
      if (dirty) {
        const msg = document.getElementById('profileSaveMsg');
        msg.className = 'cd-save-msg';
        msg.textContent = `${document.querySelectorAll('#acctView .changed').length} unsaved change(s)`;
      }
    }

    function profileDirty() {
      return document.querySelectorAll('#acctView .changed').length > 0;
    }

    async function saveProfile() {
      const changed = [...document.querySelectorAll('#acctView .changed')];
      if (!changed.length) return;
      const body = {};
      changed.forEach(el => { body[el.dataset.key] = el.value; });

      const btn = document.getElementById('profileSaveBtn');
      const msg = document.getElementById('profileSaveMsg');
      btn.disabled = true; btn.textContent = 'Saving…';
      try {
        await postJSON(`/api/admin/clients/${selectedClientId}`, 'PUT', body);
        await loadClientDetail(selectedClientId);
        loadClients();
        msg.className = 'cd-save-msg ok';
        msg.textContent = 'Saved. The client will see these changes in their portal.';
        document.getElementById('profileSaveBar').classList.remove('hidden');
        setTimeout(() => { if (!profileDirty()) document.getElementById('profileSaveBar').classList.add('hidden'); }, 4000);
      } catch (err) {
        msg.className = 'cd-save-msg error';
        msg.textContent = err.message;
      }
      btn.disabled = false; btn.textContent = 'Save changes';
    }

    function safeUrl(u) {
      try { const url = new URL(u, window.location.origin); return ['http:', 'https:'].includes(url.protocol) ? url.href : '#'; }
      catch { return '#'; }
    }

    window.addEventListener('beforeunload', e => { if (profileDirty()) { e.preventDefault(); e.returnValue = ''; } });

    async function loadClientPosts(clientId) {
      const grid = document.getElementById('adminPostsGrid');
      grid.innerHTML = '<div class="loading">Loading posts…</div>';

      try {
        const res = await fetch(`/api/admin/clients/${clientId}/posts`);
        const data = await res.json();
        renderAdminPosts(data.posts || []);
      } catch (err) {
        grid.innerHTML = '<div class="error">Could not load posts.</div>';
      }
    }

    function renderAdminPosts(posts) {
      const grid = document.getElementById('adminPostsGrid');

      if (posts.length === 0) {
        grid.innerHTML = '<div class="empty-state">No posts yet. Add one above.</div>';
        return;
      }

      grid.innerHTML = posts.map(post => `
        <div class="post-card status-${post.status}" data-id="${post.id}">
          <div class="post-meta">
            <span class="post-platform">${capitalize(post.platform)}</span>
            <span class="post-date"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-1px;margin-right:3px"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>${formatDate(post.scheduled_date)}</span>
            <span class="post-status-badge status-badge-${post.status}">${statusLabel(post.status)}</span>
          </div>

          <div class="post-caption">${escapeHtml(post.caption)}</div>

          ${post.change_notes ? `<div class="change-notes-display"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:4px"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Client notes: <strong>${escapeHtml(post.change_notes)}</strong></div>` : ''}

          <div class="post-actions">
            <button class="btn-edit" onclick="openEditModal(${post.id}, '${escapeHtml(post.platform)}', '${post.scheduled_date.slice(0,10)}', ${JSON.stringify(escapeHtml(post.caption))}, '${post.status}')"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-1px;margin-right:3px"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>Edit</button>
            <button class="btn-delete" onclick="deletePost(${post.id})"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-1px;margin-right:3px"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>Delete</button>
          </div>
        </div>
      `).join('');
    }

    // Add new post
    document.getElementById('addPostBtn').addEventListener('click', async () => {
      const caption = document.getElementById('newCaption').value.trim();
      const platform = document.getElementById('newPlatform').value;
      const scheduled_date = document.getElementById('newDate').value;

      if (!caption || !scheduled_date) {
        alert('Please fill in the caption and date.');
        return;
      }

      const btn = document.getElementById('addPostBtn');
      btn.textContent = 'Adding…';
      btn.disabled = true;

      try {
        const res = await fetch('/api/admin/posts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ client_id: selectedClientId, caption, platform, scheduled_date })
        });

        if (res.ok) {
          document.getElementById('newCaption').value = '';
          document.getElementById('newDate').value = '';
          loadClientPosts(selectedClientId);
          loadClients(); // refresh stats in sidebar
        } else {
          const data = await res.json();
          alert(data.error || 'Could not add post.');
        }
      } catch (err) {
        alert('Network error. Try again.');
      }

      btn.textContent = 'Add Post';
      btn.disabled = false;
    });

    // Edit post modal
    function openEditModal(id, platform, date, caption, status) {
      document.getElementById('editPostId').value = id;
      document.getElementById('editPlatform').value = platform;
      document.getElementById('editDate').value = date;
      document.getElementById('editCaption').value = caption;
      document.getElementById('editStatus').value = status;
      document.getElementById('editModal').classList.add('active');
    }

    document.getElementById('cancelEdit').addEventListener('click', () => {
      document.getElementById('editModal').classList.remove('active');
    });

    document.getElementById('saveEdit').addEventListener('click', async () => {
      const id = document.getElementById('editPostId').value;
      const btn = document.getElementById('saveEdit');
      btn.textContent = 'Saving…';
      btn.disabled = true;

      try {
        const res = await fetch(`/api/admin/posts/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            caption: document.getElementById('editCaption').value,
            platform: document.getElementById('editPlatform').value,
            scheduled_date: document.getElementById('editDate').value,
            status: document.getElementById('editStatus').value
          })
        });

        if (res.ok) {
          document.getElementById('editModal').classList.remove('active');
          loadClientPosts(selectedClientId);
          loadClients();
        } else {
          const data = await res.json();
          alert(data.error || 'Could not save.');
        }
      } catch (err) {
        alert('Network error.');
      }

      btn.textContent = 'Save Changes';
      btn.disabled = false;
    });

    async function deletePost(postId) {
      if (!confirm('Delete this post? This cannot be undone.')) return;

      try {
        await fetch(`/api/admin/posts/${postId}`, { method: 'DELETE' });
        loadClientPosts(selectedClientId);
        loadClients();
      } catch (err) {
        alert('Could not delete. Try again.');
      }
    }

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await fetch('/api/auth/logout', { method: 'POST' });
      window.location.href = '/';
    });

    // Runs a real $1/month charge through the full pipeline (Stripe → webhook →
    // database → GHL tag → welcome email) so you can confirm it all works end to end.
    // Cancel/refund the resulting subscription in Stripe afterward.
    document.getElementById('stripeTestBtn').addEventListener('click', async () => {
      if (!confirm('This will charge a real card $1/month to test the full payment pipeline. Continue?')) return;
      try {
        const res = await fetch('/api/stripe/create-test-checkout', { method: 'POST' });
        const data = await res.json();
        if (!res.ok || !data.url) {
          alert(data.error || 'Could not start the test checkout.');
          return;
        }
        window.location.href = data.url;
      } catch (err) {
        alert('Network error starting the test checkout.');
      }
    });

    // After returning from Stripe, let you know whether the test checkout went through
    (function checkTestResult() {
      const params = new URLSearchParams(window.location.search);
      if (params.get('test') === 'success') {
        alert('Test payment submitted. Check Railway deploy logs for "Subscription activated", then check GHL for the stripe-test@dfymarketinggroup.com contact and the welcome email.');
      } else if (params.get('test') === 'cancelled') {
        alert('Test checkout was cancelled — no charge was made.');
      }
    })();

    function formatDate(dateStr) {
      return new Date(dateStr).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC' });
    }

    function capitalize(str) { return str.charAt(0).toUpperCase() + str.slice(1); }

    function statusLabel(status) {
      const labels = { pending: 'Needs Review', approved: 'Approved', changes_requested: 'Changes Requested' };
      return labels[status] || status;
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    init();
  </script>
</body>
</html>

<html lang="en">
<head>

  <meta charset="UTF-8" />

  <title>Admin — DFY Marketing</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <style>
    /* ── Client list extras ── */
    .client-item .client-biz { font-size: 12px; color: var(--text-body); margin-top: 2px; }
    .client-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .pill { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--bg-surface-alt); color: var(--text-heading); }
    .pill.ok { background: rgba(45,107,79,0.12); color: var(--color-green-dark); }
    .pill.warn { background: rgba(125,42,3,0.10); color: var(--color-rust); }
    .progress { height: 4px; border-radius: 4px; background: var(--bg-surface-alt); margin-top: 8px; overflow: hidden; }
    .progress > span { display: block; height: 100%; background: var(--color-green); }

    /* ── Client detail ── */
    .cd-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border-subtle); margin-bottom: 20px; }
    .cd-tab { background: none; border: none; padding: 10px 16px; font: inherit; font-size: 14px; font-weight: 600; color: var(--text-body); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
    .cd-tab.active { color: var(--text-heading); border-bottom-color: var(--color-rust); }
    .cd-section { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
    .cd-section h3 { font-size: 15px; color: var(--text-heading); margin: 0 0 4px; }
    .cd-section .cd-desc { font-size: 12px; color: var(--text-muted); margin: 0 0 16px; }
    .cd-section.private { border-color: rgba(125,42,3,0.25); background: #FFFCF8; }
    .cd-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; }
    .cd-field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
    .cd-field.full { grid-column: 1 / -1; }
    .cd-field label { font-size: 12px; font-weight: 600; color: var(--text-heading); }
    .cd-field input, .cd-field select, .cd-field textarea { font: inherit; font-size: 14px; padding: 9px 11px; border: 1px solid var(--border-strong, rgba(31,61,44,0.2)); border-radius: 8px; background: #fff; color: var(--text-heading); width: 100%; box-sizing: border-box; }
    .cd-field textarea { resize: vertical; min-height: 64px; }
    .cd-field input.changed, .cd-field select.changed, .cd-field textarea.changed { border-color: var(--color-rust); background: #FFFAF5; }
    .cd-readonly { font-size: 14px; color: var(--text-heading); padding: 9px 0; word-break: break-word; }
    .cd-readonly.empty { color: var(--text-muted); font-style: italic; }
    .cd-hint { font-size: 11px; color: var(--text-muted); }
    .cd-socials { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
    .cd-social { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--border-subtle); border-radius: 8px; font-size: 14px; }
    .cd-social strong { min-width: 90px; color: var(--text-heading); text-transform: capitalize; }
    .cd-social a { color: var(--color-green); word-break: break-all; }
    .cd-social .when { margin-left: auto; font-size: 12px; color: var(--text-muted); white-space: nowrap; }
    .cd-swatches { display: flex; gap: 8px; flex-wrap: wrap; }
    .cd-swatch { display: flex; align-items: center; gap: 6px; font-size: 12px; font-family: monospace; }
    .cd-swatch i { width: 22px; height: 22px; border-radius: 6px; border: 1px solid var(--border-subtle); display: inline-block; }
    .cd-logo { max-width: 160px; max-height: 90px; object-fit: contain; border: 1px solid var(--border-subtle); border-radius: 8px; padding: 8px; background: #fff; }
    .cd-thumbs { display: flex; gap: 8px; flex-wrap: wrap; }
    .cd-thumbs img { width: 84px; height: 84px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border-subtle); }
    .cd-savebar { position: sticky; bottom: 0; display: flex; align-items: center; justify-content: flex-end; gap: 10px; padding: 12px 16px; background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 12px; box-shadow: 0 -4px 16px rgba(31,61,44,0.08); }
    .cd-save-msg { margin-right: auto; font-size: 13px; color: var(--text-body); }
    .cd-save-msg.error { color: var(--color-rust); }
    .cd-save-msg.ok { color: var(--color-green-dark); }
    @media (max-width: 760px) { .cd-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body class="admin-page">

  <header class="header">
    <div class="header-inner">
      <a href="/" class="brand-wordmark"><span class="brand-wordmark-serif">Done For You</span><span class="brand-wordmark-sans">Marketing</span></a>
      <div class="header-right">
        <span class="admin-badge">Admin</span>
        <button class="btn-secondary" id="stripeTestBtn">Run $1 Stripe test</button>
        <button class="btn-logout" id="logoutBtn">Sign out</button>
      </div>
    </div>
  </header>

  <main class="main admin-main">

    <!-- Left sidebar: client list -->
    <aside class="client-sidebar">
      <h2>Clients</h2>
      <div id="clientList"><div class="loading">Loading…</div></div>
    </aside>

    <!-- Right: selected client -->
    <section class="client-posts-section">
      <div id="clientPostsHeader" class="client-posts-header">
        <p class="select-prompt">← Select a client to see their profile and posts</p>
      </div>

      <div id="clientTabs" class="cd-tabs hidden">
        <button class="cd-tab active" data-tab="profile" onclick="showTab('profile')">Profile</button>
        <button class="cd-tab" data-tab="posts" onclick="showTab('posts')">Posts</button>
      </div>

      <!-- PROFILE TAB -->
      <div id="profilePane" class="hidden">
        <div id="profileBody"></div>
        <div class="cd-savebar hidden" id="profileSaveBar">
          <span id="profileSaveMsg" class="cd-save-msg"></span>
          <button class="btn-secondary" id="profileResetBtn" onclick="renderProfile(currentDetail)">Discard changes</button>
          <button class="btn-primary" id="profileSaveBtn" onclick="saveProfile()">Save changes</button>
        </div>
      </div>

      <!-- POSTS TAB -->
      <div id="postsPane" class="hidden">
      <div id="addPostForm" class="add-post-form hidden">
        <h3>Add New Post</h3>
        <div class="form-row">
          <div class="field">
            <label>Platform</label>
            <select id="newPlatform">
              <option value="instagram">Instagram</option>
              <option value="facebook">Facebook</option>
              <option value="twitter">Twitter / X</option>
              <option value="linkedin">LinkedIn</option>
              <option value="tiktok">TikTok</option>
            </select>
          </div>
          <div class="field">
            <label>Scheduled Date</label>
            <input type="date" id="newDate" />
          </div>
        </div>
        <div class="field">
          <label>Caption</label>
          <textarea id="newCaption" rows="4" placeholder="Write the post caption here…"></textarea>
        </div>
        <button class="btn-primary" id="addPostBtn">Add Post</button>
      </div>

      <div id="adminPostsGrid" class="posts-grid"></div>
      </div>
    </section>

  </main>

  <!-- Edit post modal -->
  <div class="modal-overlay" id="editModal">
    <div class="modal">
      <h2>Edit Post</h2>
      <input type="hidden" id="editPostId" />
      <div class="field">
        <label>Platform</label>
        <select id="editPlatform">
          <option value="instagram">Instagram</option>
          <option value="facebook">Facebook</option>
          <option value="twitter">Twitter / X</option>
          <option value="linkedin">LinkedIn</option>
          <option value="tiktok">TikTok</option>
        </select>
      </div>
      <div class="field">
        <label>Scheduled Date</label>
        <input type="date" id="editDate" />
      </div>
      <div class="field">
        <label>Caption</label>
        <textarea id="editCaption" rows="5"></textarea>
      </div>
      <div class="field">
        <label>Status</label>
        <select id="editStatus">
          <option value="pending">Pending</option>
          <option value="approved">Approved</option>
          <option value="changes_requested">Changes Requested</option>
        </select>
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" id="cancelEdit">Cancel</button>
        <button class="btn-primary" id="saveEdit">Save Changes</button>
      </div>
    </div>
  </div>

  <script>
    let selectedClientId = null;
    let selectedClientName = '';

    async function init() {
      const meRes = await fetch('/api/auth/me');
      const meData = await meRes.json();

      if (!meData.user || !meData.user.is_admin) {
        window.location.href = meData.user ? '/dashboard' : '/';
        return;
      }

      loadClients();
    }

    async function loadClients() {
      try {
        const res = await fetch('/api/admin/clients');
        const data = await res.json();
        renderClients(data.clients || []);
      } catch (err) {
        document.getElementById('clientList').innerHTML = '<div class="error">Could not load clients.</div>';
      }
    }

    function renderClients(clients) {
      const list = document.getElementById('clientList');

      if (clients.length === 0) {
        list.innerHTML = '<p class="empty-state">No clients yet. Add one via Terminal.</p>';
        return;
      }

      list.innerHTML = clients.map(client => {
        const pct = Math.round((Number(client.profile_filled) / Number(client.profile_total || 1)) * 100);
        const status = client.subscription_status || client.status || '';
        const statusClass = ['active'].includes(status) ? 'ok' : (['past_due', 'cancelled', 'cancelling', 'pending'].includes(status) ? 'warn' : '');
        return `
        <div class="client-item ${client.id == selectedClientId ? 'active' : ''}" data-id="${client.id}" onclick="selectClient(${client.id})">
          <div class="client-name">${escapeHtml(client.business_name || client.name)}</div>
          ${client.business_name ? `<div class="client-biz">${escapeHtml(client.name)}</div>` : ''}
          <div class="client-meta">
            ${client.plan ? `<span class="pill">${escapeHtml(client.plan)}</span>` : ''}
            ${status ? `<span class="pill ${statusClass}">${escapeHtml(status.replace('_', ' '))}</span>` : ''}
            <span class="pill">${client.social_count} socials</span>
          </div>
          <div class="progress" title="Profile ${pct}% complete"><span style="width:${pct}%"></span></div>
          <div class="client-stats">
            <span class="stat pending">${client.pending} pending</span>
            <span class="stat changes">${client.changes_requested} changes</span>
            <span class="stat approved">${client.approved} approved</span>
          </div>
        </div>`;
      }).join('');
    }

    let currentDetail = null;
    let currentTab = 'profile';

    async function selectClient(clientId) {
      if (profileDirty() && !confirm('You have unsaved profile changes. Leave without saving?')) return;
      selectedClientId = clientId;

      document.querySelectorAll('.client-item').forEach(el =>
        el.classList.toggle('active', el.dataset.id == clientId));

      document.getElementById('clientPostsHeader').innerHTML = '<div class="loading">Loading…</div>';
      document.getElementById('clientTabs').classList.remove('hidden');
      document.getElementById('addPostForm').classList.remove('hidden');

      await loadClientDetail(clientId);
      showTab(currentTab);
      loadClientPosts(clientId);
    }

    function showTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.cd-tab').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
      document.getElementById('profilePane').classList.toggle('hidden', tab !== 'profile');
      document.getElementById('postsPane').classList.toggle('hidden', tab !== 'posts');
    }

    // ─── PROFILE TAB ─────────────────────────────────────────────
    // Every editable field maps to one column. "src" says which part of the
    // API response it comes from. Edits save to the same records the client's
    // own Profile page uses, so there is one copy of each client's data.
    const VOICES = ['Professional', 'Friendly', 'Trustworthy', 'Confident', 'Engaging', 'Empathetic', 'Innovative'];
    const GOALS = ['Build brand awareness', 'Grow followers & engagement', 'Generate leads & sales', 'Build community & loyalty', 'Establish thought leadership'];
    const TIMEZONES = [
      ['America/Los_Angeles', 'Pacific (Los Angeles)'], ['America/Denver', 'Mountain (Denver)'],
      ['America/Phoenix', 'Mountain, no DST (Phoenix)'], ['America/Chicago', 'Central (Chicago)'],
      ['America/New_York', 'Eastern (New York)'], ['America/Anchorage', 'Alaska'], ['Pacific/Honolulu', 'Hawaii'],
    ];
    const SECTIONS = [
      { title: 'Account', desc: 'Login and contact details.', fields: [
        { key: 'business_name', label: 'Business name', src: 'client' },
        { key: 'name', label: 'Contact name', src: 'client' },
        { key: 'email', label: 'Login email', src: 'client', type: 'email', hint: 'Changing this changes the email they log in with.' },
      ]},
      { title: 'Business info', desc: 'From the client\'s Business Profile.', fields: [
        { key: 'industry', label: 'Industry', list: ['Home Services', 'Auto Dealer', 'Beauty Services'] },
        { key: 'website', label: 'Website', type: 'url' },
        { key: 'phone', label: 'Business phone', type: 'tel' },
        { key: 'business_email', label: 'Business email', type: 'email' },
        { key: 'address', label: 'Street address', full: true },
        { key: 'city', label: 'City' },
        { key: 'state', label: 'State' },
        { key: 'zip', label: 'ZIP' },
        { key: 'timezone', label: 'Time zone', options: TIMEZONES },
        { key: 'referral_source', label: 'How they heard about us' },
      ]},
      { title: 'Brand & content', desc: 'What we use to write their posts.', fields: [
        { key: 'brand_voice', label: 'Brand voice', options: VOICES.map(v => [v, v]) },
        { key: 'primary_goal', label: 'Primary goal', options: GOALS.map(g => [g, g]) },
        { key: 'target_audience', label: 'Target audience', textarea: true, full: true },
        { key: 'content_themes', label: 'Customer pain points / content themes', textarea: true, full: true },
        { key: 'unique_selling_point', label: 'What makes them different', textarea: true, full: true },
        { key: 'avoid_content', label: 'Topics to avoid', textarea: true, full: true },
        { key: 'additional_notes', label: 'Anything else they told us', textarea: true, full: true },
      ]},
    ];

    async function loadClientDetail(clientId) {
      try {
        const res = await fetch(`/api/admin/clients/${clientId}`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Could not load client.');
        currentDetail = data;
        const c = data.client;
        selectedClientName = c.business_name || c.name;
        document.getElementById('clientPostsHeader').innerHTML = `<h2>${escapeHtml(selectedClientName)}</h2>`;
        renderProfile(data);
      } catch (err) {
        document.getElementById('clientPostsHeader').innerHTML = `<div class="error">${escapeHtml(err.message)}</div>`;
        document.getElementById('profileBody').innerHTML = '';
      }
    }

    function fieldValue(data, f) {
      const src = f.src === 'client' ? data.client : data.profile;
      return src[f.key] ?? '';
    }

    function renderField(data, f) {
      const v = fieldValue(data, f);
      const attrs = `data-key="${f.key}" data-original="${escapeHtml(v)}" oninput="markChanged(this)" onchange="markChanged(this)"`;
      let input;
      if (f.textarea) {
        input = `<textarea rows="3" ${attrs}>${escapeHtml(v)}</textarea>`;
      } else if (f.options) {
        const known = f.options.some(([val]) => val === v);
        input = `<select ${attrs}>
          <option value="">Not set</option>
          ${f.options.map(([val, label]) => `<option value="${escapeHtml(val)}" ${val === v ? 'selected' : ''}>${escapeHtml(label)}</option>`).join('')}
          ${v && !known ? `<option value="${escapeHtml(v)}" selected>${escapeHtml(v)}</option>` : ''}
        </select>`;
      } else {
        const listId = f.list ? `dl-${f.key}` : '';
        input = `<input type="${f.type || 'text'}" value="${escapeHtml(v)}" ${listId ? `list="${listId}"` : ''} ${attrs} />
          ${f.list ? `<datalist id="${listId}">${f.list.map(o => `<option value="${escapeHtml(o)}">`).join('')}</datalist>` : ''}`;
      }
      return `<div class="cd-field ${f.full ? 'full' : ''}">
        <label>${escapeHtml(f.label)}</label>${input}
        ${f.hint ? `<span class="cd-hint">${escapeHtml(f.hint)}</span>` : ''}
      </div>`;
    }

    function readonly(label, value, full) {
      const empty = value === null || value === undefined || value === '';
      return `<div class="cd-field ${full ? 'full' : ''}"><label>${escapeHtml(label)}</label>
        <div class="cd-readonly ${empty ? 'empty' : ''}">${empty ? 'Not set' : value}</div></div>`;
    }

    function renderProfile(data) {
      if (!data) return;
      const c = data.client, p = data.profile, b = data.brand_assets;
      const fmt = d => d ? new Date(d).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '';

      const sections = SECTIONS.map(s => `
        <div class="cd-section">
          <h3>${escapeHtml(s.title)}</h3><p class="cd-desc">${escapeHtml(s.desc)}</p>
          <div class="cd-grid">${s.fields.map(f => renderField(data, f)).join('')}</div>
        </div>`).join('');

      const plan = `
        <div class="cd-section">
          <h3>Plan & billing</h3><p class="cd-desc">Read-only here. Billing changes happen in Stripe so the two never disagree.</p>
          <div class="cd-grid">
            ${readonly('Plan', escapeHtml(c.plan || ''))}
            ${readonly('Subscription', escapeHtml((c.subscription_status || '').replace('_', ' ')))}
            ${readonly('Client since', fmt(c.subscription_start_date || c.created_at))}
            ${readonly('Next billing date', fmt(c.billing_date))}
            ${c.stripe_customer_id ? readonly('Stripe', `<a href="https://dashboard.stripe.com/customers/${encodeURIComponent(c.stripe_customer_id)}" target="_blank" rel="noopener">Open customer in Stripe ↗</a>`, true) : ''}
            ${readonly('Profile last updated', fmt(p.updated_at))}
          </div>
        </div>`;

      const socials = `
        <div class="cd-section">
          <h3>Social accounts</h3><p class="cd-desc">Accounts the client marked as connected on their Profile page.</p>
          <div class="cd-socials">
            ${data.socials.length ? data.socials.map(s => `
              <div class="cd-social">
                <strong>${escapeHtml(s.platform)}</strong>
                <span>${escapeHtml(s.username)}</span>
                ${s.profile_url ? `<a href="${escapeHtml(safeUrl(s.profile_url))}" target="_blank" rel="noopener">${escapeHtml(s.profile_url)}</a>` : ''}
                <span class="when">${fmt(s.connected_at)}</span>
              </div>`).join('') : '<div class="cd-readonly empty">None connected yet.</div>'}
          </div>
          <div class="cd-grid">${renderField(data, { key: 'social_notes', label: 'Client notes about their accounts', textarea: true, full: true })}</div>
        </div>`;

      const colors = (b.brand_colors || []).map(col => typeof col === 'string' ? col : (col.hex || col.value || '')).filter(Boolean);
      const t = b.brand_typography || {};
      const brand = `
        <div class="cd-section">
          <h3>Brand assets</h3><p class="cd-desc">Logo, colors, fonts and photos the client uploaded.</p>
          <div class="cd-grid">
            ${readonly('Logo', b.logo_url ? `<a href="${escapeHtml(safeUrl(b.logo_url))}" target="_blank" rel="noopener"><img class="cd-logo" src="${escapeHtml(safeUrl(b.logo_url))}" alt="Logo"></a>` : '')}
            ${readonly('Brand colors', colors.length ? `<div class="cd-swatches">${colors.map(h => `<span class="cd-swatch"><i style="background:${escapeHtml(h)}"></i>${escapeHtml(h)}</span>`).join('')}</div>` : '')}
            ${readonly('Heading font', escapeHtml(t.heading_font || ''))}
            ${readonly('Body font', escapeHtml(t.body_font || ''))}
            ${t.notes ? readonly('Font notes', escapeHtml(t.notes), true) : ''}
            ${b.brand_website_url ? readonly('Brand imported from', `<a href="${escapeHtml(safeUrl(b.brand_website_url))}" target="_blank" rel="noopener">${escapeHtml(b.brand_website_url)}</a>`, true) : ''}
            ${readonly('Photos & content', (b.content_urls || []).length ? `<div class="cd-thumbs">${b.content_urls.map(u => { const url = typeof u === 'string' ? u : (u.url || ''); return url ? `<a href="${escapeHtml(safeUrl(url))}" target="_blank" rel="noopener"><img src="${escapeHtml(safeUrl(url))}" alt=""></a>` : ''; }).join('')}</div>` : '', true)}
          </div>
        </div>`;

      const notes = `
        <div class="cd-section private">
          <h3>Internal notes</h3><p class="cd-desc">Only you and your team see this. The client never does.</p>
          <div class="cd-grid">${renderField(data, { key: 'admin_notes', label: 'Notes', src: 'client', textarea: true, full: true })}</div>
        </div>`;

      document.getElementById('profileBody').innerHTML = sections + socials + brand + notes + plan;
      document.getElementById('profileSaveBar').classList.add('hidden');
      document.getElementById('profileSaveMsg').textContent = '';
    }

    function markChanged(el) {
      el.classList.toggle('changed', el.value !== el.dataset.original);
      const dirty = profileDirty();
      document.getElementById('profileSaveBar').classList.toggle('hidden', !dirty);
      if (dirty) {
        const msg = document.getElementById('profileSaveMsg');
        msg.className = 'cd-save-msg';
        msg.textContent = `${document.querySelectorAll('#profileBody .changed').length} unsaved change(s)`;
      }
    }

    function profileDirty() {
      return document.querySelectorAll('#profileBody .changed').length > 0;
    }

    async function saveProfile() {
      const changed = [...document.querySelectorAll('#profileBody .changed')];
      if (!changed.length) return;
      const body = {};
      changed.forEach(el => { body[el.dataset.key] = el.value; });

      const btn = document.getElementById('profileSaveBtn');
      const msg = document.getElementById('profileSaveMsg');
      btn.disabled = true; btn.textContent = 'Saving…';
      try {
        const res = await fetch(`/api/admin/clients/${selectedClientId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Could not save.');
        await loadClientDetail(selectedClientId);
        loadClients();
        msg.className = 'cd-save-msg ok';
        msg.textContent = 'Saved. The client will see these changes on their Profile page.';
        document.getElementById('profileSaveBar').classList.remove('hidden');
        setTimeout(() => { if (!profileDirty()) document.getElementById('profileSaveBar').classList.add('hidden'); }, 4000);
      } catch (err) {
        msg.className = 'cd-save-msg error';
        msg.textContent = err.message;
      }
      btn.disabled = false; btn.textContent = 'Save changes';
    }

    function safeUrl(u) {
      try { const url = new URL(u, window.location.origin); return ['http:', 'https:'].includes(url.protocol) ? url.href : '#'; }
      catch { return '#'; }
    }

    window.addEventListener('beforeunload', e => { if (profileDirty()) { e.preventDefault(); e.returnValue = ''; } });

    async function loadClientPosts(clientId) {
      const grid = document.getElementById('adminPostsGrid');
      grid.innerHTML = '<div class="loading">Loading posts…</div>';

      try {
        const res = await fetch(`/api/admin/clients/${clientId}/posts`);
        const data = await res.json();
        renderAdminPosts(data.posts || []);
      } catch (err) {
        grid.innerHTML = '<div class="error">Could not load posts.</div>';
      }
    }

    function renderAdminPosts(posts) {
      const grid = document.getElementById('adminPostsGrid');

      if (posts.length === 0) {
        grid.innerHTML = '<div class="empty-state">No posts yet. Add one above.</div>';
        return;
      }

      grid.innerHTML = posts.map(post => `
        <div class="post-card status-${post.status}" data-id="${post.id}">
          <div class="post-meta">
            <span class="post-platform">${capitalize(post.platform)}</span>
            <span class="post-date"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-1px;margin-right:3px"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>${formatDate(post.scheduled_date)}</span>
            <span class="post-status-badge status-badge-${post.status}">${statusLabel(post.status)}</span>
          </div>

          <div class="post-caption">${escapeHtml(post.caption)}</div>

          ${post.change_notes ? `<div class="change-notes-display"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:4px"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Client notes: <strong>${escapeHtml(post.change_notes)}</strong></div>` : ''}

          <div class="post-actions">
            <button class="btn-edit" onclick="openEditModal(${post.id}, '${escapeHtml(post.platform)}', '${post.scheduled_date.slice(0,10)}', ${JSON.stringify(escapeHtml(post.caption))}, '${post.status}')"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-1px;margin-right:3px"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>Edit</button>
            <button class="btn-delete" onclick="deletePost(${post.id})"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-1px;margin-right:3px"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>Delete</button>
          </div>
        </div>
      `).join('');
    }

    // Add new post
    document.getElementById('addPostBtn').addEventListener('click', async () => {
      const caption = document.getElementById('newCaption').value.trim();
      const platform = document.getElementById('newPlatform').value;
      const scheduled_date = document.getElementById('newDate').value;

      if (!caption || !scheduled_date) {
        alert('Please fill in the caption and date.');
        return;
      }

      const btn = document.getElementById('addPostBtn');
      btn.textContent = 'Adding…';
      btn.disabled = true;

      try {
        const res = await fetch('/api/admin/posts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ client_id: selectedClientId, caption, platform, scheduled_date })
        });

        if (res.ok) {
          document.getElementById('newCaption').value = '';
          document.getElementById('newDate').value = '';
          loadClientPosts(selectedClientId);
          loadClients(); // refresh stats in sidebar
        } else {
          const data = await res.json();
          alert(data.error || 'Could not add post.');
        }
      } catch (err) {
        alert('Network error. Try again.');
      }

      btn.textContent = 'Add Post';
      btn.disabled = false;
    });

    // Edit post modal
    function openEditModal(id, platform, date, caption, status) {
      document.getElementById('editPostId').value = id;
      document.getElementById('editPlatform').value = platform;
      document.getElementById('editDate').value = date;
      document.getElementById('editCaption').value = caption;
      document.getElementById('editStatus').value = status;
      document.getElementById('editModal').classList.add('active');
    }

    document.getElementById('cancelEdit').addEventListener('click', () => {
      document.getElementById('editModal').classList.remove('active');
    });

    document.getElementById('saveEdit').addEventListener('click', async () => {
      const id = document.getElementById('editPostId').value;
      const btn = document.getElementById('saveEdit');
      btn.textContent = 'Saving…';
      btn.disabled = true;

      try {
        const res = await fetch(`/api/admin/posts/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            caption: document.getElementById('editCaption').value,
            platform: document.getElementById('editPlatform').value,
            scheduled_date: document.getElementById('editDate').value,
            status: document.getElementById('editStatus').value
          })
        });

        if (res.ok) {
          document.getElementById('editModal').classList.remove('active');
          loadClientPosts(selectedClientId);
          loadClients();
        } else {
          const data = await res.json();
          alert(data.error || 'Could not save.');
        }
      } catch (err) {
        alert('Network error.');
      }

      btn.textContent = 'Save Changes';
      btn.disabled = false;
    });

    async function deletePost(postId) {
      if (!confirm('Delete this post? This cannot be undone.')) return;

      try {
        await fetch(`/api/admin/posts/${postId}`, { method: 'DELETE' });
        loadClientPosts(selectedClientId);
        loadClients();
      } catch (err) {
        alert('Could not delete. Try again.');
      }
    }

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await fetch('/api/auth/logout', { method: 'POST' });
      window.location.href = '/';
    });

    // Runs a real $1/month charge through the full pipeline (Stripe → webhook →
    // database → GHL tag → welcome email) so you can confirm it all works end to end.
    // Cancel/refund the resulting subscription in Stripe afterward.
    document.getElementById('stripeTestBtn').addEventListener('click', async () => {
      if (!confirm('This will charge a real card $1/month to test the full payment pipeline. Continue?')) return;
      try {
        const res = await fetch('/api/stripe/create-test-checkout', { method: 'POST' });
        const data = await res.json();
        if (!res.ok || !data.url) {
          alert(data.error || 'Could not start the test checkout.');
          return;
        }
        window.location.href = data.url;
      } catch (err) {
        alert('Network error starting the test checkout.');
      }
    });

    // After returning from Stripe, let you know whether the test checkout went through
    (function checkTestResult() {
      const params = new URLSearchParams(window.location.search);
      if (params.get('test') === 'success') {
        alert('Test payment submitted. Check Railway deploy logs for "Subscription activated", then check GHL for the stripe-test@dfymarketinggroup.com contact and the welcome email.');
      } else if (params.get('test') === 'cancelled') {
        alert('Test checkout was cancelled — no charge was made.');
      }
    })();

    function formatDate(dateStr) {
      return new Date(dateStr).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC' });
    }

    function capitalize(str) { return str.charAt(0).toUpperCase() + str.slice(1); }

    function statusLabel(status) {
      const labels = { pending: 'Needs Review', approved: 'Approved', changes_requested: 'Changes Requested' };
      return labels[status] || status;
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    init();
  </script>
</body>
</html>
